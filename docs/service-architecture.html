<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3DOrienter hosted service architecture</title>
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4; --external:#fde68a; --risk:#fecaca; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd; --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e; --external:#92400e; --risk:#991b1b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1180px; margin:32px auto; padding:0 20px; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:22px; font-weight:650; fill:var(--fg); }
  .zone-title { font-size:15px; font-weight:650; fill:var(--fg); }
  .label { font-size:14px; font-weight:600; fill:var(--fg); }
  .small { font-size:12px; fill:var(--muted); }
  .node { stroke:var(--line); stroke-width:1; rx:10; }
  .neutral { fill:var(--neutral); } .input { fill:var(--input); } .process { fill:var(--process); } .storage { fill:var(--storage); } .external { fill:var(--external); } .risk { fill:var(--risk); }
  .edge { stroke:var(--line); stroke-width:1.7; fill:none; marker-end:url(#arrow); }
  .zone { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:6 5; opacity:.8; rx:14; }
</style>
<main>
<svg viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">3DOrienter hosted service architecture</title>
  <desc id="desc">A public cloud control plane sends jobs to a private RTX 4070 worker, which performs image reconstruction, mesh validation, orientation, slicing, and artifact upload.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" /></marker></defs>

  <text x="30" y="34" class="title">3DOrienter hosted service - trust zones and job flow</text>
  <text x="30" y="56" class="small">Public control plane stays online; the consumer GPU worker connects outbound and remains private.</text>

  <!-- Connectors behind nodes -->
  <path class="edge" d="M180 150 H260" />
  <path class="edge" d="M410 150 H485" />
  <path class="edge" d="M640 150 H720" />
  <path class="edge" d="M800 190 V250" />
  <path class="edge" d="M720 315 H640" />
  <path class="edge" d="M485 315 H410" />
  <path class="edge" d="M335 355 V430 H760 V470" />
  <path class="edge" d="M835 520 H900" />
  <path class="edge" d="M900 560 H835" />
  <path class="edge" d="M760 570 V635 H640" />
  <path class="edge" d="M485 675 H410" />
  <path class="edge" d="M260 675 H180 V190" />
  <path class="edge" d="M565 355 V470" />

  <!-- Public zone -->
  <rect x="240" y="76" width="650" height="320" class="zone" />
  <text x="260" y="100" class="zone-title">EU-hosted public control plane</text>

  <rect x="30" y="110" width="150" height="80" class="node input" />
  <text x="105" y="143" text-anchor="middle" class="label">User browser</text>
  <text x="105" y="164" text-anchor="middle" class="small">upload / configure / pay</text>

  <rect x="260" y="110" width="150" height="80" class="node process" />
  <text x="335" y="143" text-anchor="middle" class="label">Web + API</text>
  <text x="335" y="164" text-anchor="middle" class="small">auth / projects / policy</text>

  <rect x="485" y="110" width="155" height="80" class="node external" />
  <text x="562" y="143" text-anchor="middle" class="label">Billing provider</text>
  <text x="562" y="164" text-anchor="middle" class="small">checkout / signed webhooks</text>

  <rect x="720" y="110" width="160" height="80" class="node storage" />
  <text x="800" y="143" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="800" y="164" text-anchor="middle" class="small">state / credits / audit</text>

  <rect x="720" y="250" width="160" height="105" class="node process" />
  <text x="800" y="286" text-anchor="middle" class="label">Durable queue</text>
  <text x="800" y="307" text-anchor="middle" class="small">leases / retries / heartbeat</text>
  <text x="800" y="327" text-anchor="middle" class="small">GPU concurrency = 1</text>

  <rect x="485" y="250" width="155" height="105" class="node storage" />
  <text x="562" y="286" text-anchor="middle" class="label">Object storage</text>
  <text x="562" y="307" text-anchor="middle" class="small">private EU bucket</text>
  <text x="562" y="327" text-anchor="middle" class="small">short-lived signed URLs</text>

  <rect x="260" y="250" width="150" height="105" class="node neutral" />
  <text x="335" y="286" text-anchor="middle" class="label">Preflight</text>
  <text x="335" y="307" text-anchor="middle" class="small">decode / strip EXIF</text>
  <text x="335" y="327" text-anchor="middle" class="small">limits / moderation</text>

  <!-- Private worker zone -->
  <rect x="225" y="440" width="655" height="275" class="zone" />
  <text x="245" y="464" class="zone-title">Private compute plane - outbound-only worker connection</text>

  <rect x="260" y="485" width="150" height="85" class="node process" />
  <text x="335" y="518" text-anchor="middle" class="label">Worker agent</text>
  <text x="335" y="539" text-anchor="middle" class="small">sandbox / cleanup / metrics</text>

  <rect x="485" y="485" width="155" height="85" class="node process" />
  <text x="562" y="518" text-anchor="middle" class="label">Image to mesh</text>
  <text x="562" y="539" text-anchor="middle" class="small">model adapter / RTX 4070</text>

  <rect x="700" y="470" width="135" height="100" class="node process" />
  <text x="767" y="505" text-anchor="middle" class="label">Mesh pipeline</text>
  <text x="767" y="526" text-anchor="middle" class="small">validate / scale</text>
  <text x="767" y="546" text-anchor="middle" class="small">preview / repair</text>

  <rect x="900" y="485" width="220" height="85" class="node risk" />
  <text x="1010" y="518" text-anchor="middle" class="label">ComfyUI (optional)</text>
  <text x="1010" y="539" text-anchor="middle" class="small">localhost/private only / never public</text>

  <rect x="485" y="635" width="155" height="80" class="node process" />
  <text x="562" y="667" text-anchor="middle" class="label">3DOrienter</text>
  <text x="562" y="688" text-anchor="middle" class="small">candidate rotations / report</text>

  <rect x="260" y="635" width="150" height="80" class="node process" />
  <text x="335" y="667" text-anchor="middle" class="label">Slicer validation</text>
  <text x="335" y="688" text-anchor="middle" class="small">time / material / supports</text>

  <text x="905" y="610" class="small">Production hard gate: every model/weight license reviewed</text>
  <text x="905" y="630" class="small">Hunyuan3D 2.1 disabled in EU absent separate rights</text>
</svg>
</main>
