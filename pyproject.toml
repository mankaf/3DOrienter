[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3dorienter"
version = "0.2.0"
description = "Image-to-mesh validation and FDM print-orientation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "3DOrienter project"}]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.7",
  "scipy>=1.13",
  "trimesh>=4.4",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
3dorienter = "orienter3d.cli:app"
3dorienter-pipeline = "orienter3d.service.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
